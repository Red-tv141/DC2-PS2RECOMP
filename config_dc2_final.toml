#   python tools/fix_cop2_q_ps2_float.py recomp   # VU0 macro VDIV/VSQRT PS2 float (G372)
#   python tools/fix_cop1_ps2_float.py  recomp    # COP1 div.s; the R5900 FPU is NOT IEEE (G371)
