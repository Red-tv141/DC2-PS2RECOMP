# DO NOT RUN tools/fix_cop2_destmask.py  (STALE - it now CORRUPTS the output)
#
# PS2_PROJECT_STATE.md listed it as mandatory. That is no longer true: the recompiler
# emits correct COP2 partial dest-component masks today, and the script reverses them a
# SECOND time. Measured: it rewrites 23 files / 137 masks, and 15 of those files are
# byte-identical to the shipped tree BEFORE it runs. Example - `mgDistVectorXZ__FPf`
# @0x130000, an `.xyz` write: correct (and what both the shipped tree and a fresh regen
# contain) is `_mm_set_epi32(0, -1, -1, -1)`; the script turns it into
# `_mm_set_epi32(-1, -1, -1, 0)`, i.e. it writes the W lane and drops X. It is retained
# in tools/ only for historical reference (F51.8).
