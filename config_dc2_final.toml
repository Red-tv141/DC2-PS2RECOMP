# This exact pipeline was run against a scratch output directory and diffed file-by-file
# against the shipped `recomp/` tree:
#
#   guest/host boundary : EXACT   - 410 stub dispatches (same ps2_stubs::/ps2_syscalls::
#                                   target symbol), 43 TODO_NAMED, 7353 recompiled bodies
#   byte-level          : 7801 / 7807 files identical
#   the 6 that differ   : 5 generated bodies carrying HAND-INSERTED opt-in diagnostic
#                         probes (DC2_TRACE_G19, G198/DC2_G199_QW30, DC2_G221_CAMTRACE,
#                         DC2_TRACE_G227) plus register_functions.cpp, where 11 identical
#                         registrations merely sit in a different position. Re-apply the
#                         probes by hand after a regen, or accept losing them.
#
