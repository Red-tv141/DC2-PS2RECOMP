# =============================================================================
# Dark Cloud 2 (NTSC-U, SCUS_972.13) - FINAL ps2_recomp configuration
#
#   Generated 2026-07-26 (phase G380) by reverse-engineering the CURRENT WORKING
#   `recomp/` tree, not by editing one of the historical configs. Every entry below
#   was verified against what the shipped 7806-file generated tree actually contains.
#
#   Supersedes all three previous configs:
#     ref/config_auto_recomp.toml              328 stubs - a STRICT SUBSET of this file
#     ref/config_auto_recomp_F56baseline.toml  389 stubs + 11 skip - also a strict subset
#     patch/DAC.toml                           390 stubs - effective ancestor of the live tree
#   Set arithmetic, by ADDRESS:  auto  <  F56  <  DAC  <  live(this file).
#   Adopting either of the first two would UN-STUB working functions and regress the port.
#
#   `patch/darkCloud2.patch` is NOT a config and NOT a game patch: it is a UTF-16 diff
#   against the ps2xRuntime SOURCE (ps2_iop.h/.cpp, Kernel/Syscalls/RPC.cpp,
#   game_overrides.cpp) adding DC2 ezMidi IOP-RPC support. Three of its four files were
#   already merged into this fork; the `game_overrides.cpp` registration had been dropped
#   during the PR port, leaving the whole ezMidi layer dead code (`handleEzMidiRpc` bails
#   on `rpcSid == 0`). Restored in G380 - nothing about it belongs in this TOML.
#
#   Schema note - the loader (ps2xRecomp/src/lib/config_manager.cpp) reads ONLY:
#     [general] input, output, ghidra_output, single_file_output, patch_syscalls,
#               patch_cop0, patch_cache, low_memory_mode, output_worker_threads,
#               giant_function_instruction_threshold, stubs[], skip[],
#               external_call_target_manifests[]
#     [patches].instructions[], [mmio], [jump_tables]
#   Everything else (elf_hash, [ghidra_export], [triage_advisory], `nop =`, `patch =`)
#   is IGNORED by the recompiler. Those sections in the old configs were documentation
#   that read like configuration - do not re-add them.
# =============================================================================

[general]
# Documentation only - not read by the recompiler. Re-run the enricher if it changes.
elf_hash = "5c0bad0610323eaba6f06c8be8869de6"

input = "./SCUS_972.13"
output = "./output"
ghidra_output = "./DAC.csv"
single_file_output = false

# Live settings - do not change without re-verifying the Graphic Test routes.
#   patch_syscalls = false : DC2 reaches libkernel through the recompiled wrappers
#                            listed below, not through raw `syscall` patching.
#   patch_cop0     = true  : COP0 access is emulated by the runtime.
#   patch_cache    = true  : cache instructions become no-ops.
patch_syscalls = false
patch_cop0 = true
patch_cache = true

# -----------------------------------------------------------------------------
# stubs - 453 addresses: exactly the set the live tree redirects out of guest code.
#
# IMPORTANT - this list is not the whole story. `PS2Recompiler::isStubFunction` falls
# through to `ps2_runtime_calls::isStubName`, which matches the 543-name PS2_STUB_LIST
# and 122-name PS2_SYSCALL_LIST tables in `ps2xRuntime/include/ps2_call_list.h` (with an
# optional leading-underscore alias). 400 of the 453 entries below would be stubbed even
# if this array were empty - that is why the three historical configs, which differ by up
# to 125 entries, all produced nearly the same output.
#
# They are listed anyway, explicitly and by ADDRESS, so that this file - not a header in
# another subtree - is the single authoritative statement of the port's guest/host
# boundary, and so a future edit to ps2_call_list.h cannot silently move a guest function
# from "stubbed" to "recompiled".
#
# Annotations:
#   (blank)             -> ps2_stubs::<name>
#   [syscall]           -> ps2_syscalls::<name>
#   !! DEAD             -> the name resolves in NEITHER table, so the recompiler emitted
#                          `ps2_stubs::TODO_NAMED(...)`, which THROWS
#                          "Unimplemented PS2 stub called" and ends the process.
#   !! DEAD-OVERRIDDEN  -> same, but repaired at runtime by an explicit
#                          `runtime.registerFunction()` in dc2_game_override_parts/.
#
#   As of G381 there are ZERO `!! DEAD` entries left: the 36 that still throw in the
#   GENERATED tree are all repaired at runtime by
#   `dc2_game_override_parts/g381_dead_stub_repairs.inc` (kill DC2_G381_NO_DEAD_STUBS=1,
#   trace DC2_G381_TRACE=1, bind self-test DC2_G381_SELFTEST=1 -> "35/35 bound", the 36th
#   being G380's sceDevctl). A regen re-emits the throwing bodies, but the overrides are
#   registered by ADDRESS and therefore survive it. Semantics: HDD/host-fs calls answer
#   -11 "no device" (a fake success walks the guest into an HDD install that is not there),
#   cache/TLB/exception/callback calls answer 0, `sbrk` answers -1 (ENOMEM).
# -----------------------------------------------------------------------------
